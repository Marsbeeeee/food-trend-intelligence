[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "food-trend-intelligence"
version = "0.2.0"
description = "Account-first overseas bread creator discovery and video comparisons"
requires-python = ">=3.11"
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
export = ["python-docx", "pypdf"]

[project.scripts]
food-trend = "pipeline.cli:main"

[tool.setuptools]
packages = ["pipeline"]

