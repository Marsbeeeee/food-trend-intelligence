<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美食候选 · 复查台</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--panel:#fff;--text:#202932;--muted:#586674;--line:#dce2e7;--accent:#116957;--soft:#e7f3ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1440px;margin:auto;padding:32px}h1{font-size:26px;margin:0}p{margin:6px 0 18px;color:var(--muted)}button,select,input,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--panel)}button,a{cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}.actions,.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.filters label{display:flex;gap:8px;align-items:center}.filters input{width:240px;max-width:100%}#notice{white-space:pre-wrap;color:var(--muted)}#notice.error{color:#b42d28}.layout{display:grid;grid-template-columns:minmax(270px,360px) minmax(0,1fr);gap:22px}.list{max-height:75vh;overflow:auto;display:flex;flex-direction:column;gap:8px}.item{text-align:left;width:100%;padding:14px}.item[aria-pressed=true]{border:2px solid var(--accent);background:var(--soft)}.meta{font-size:13px;color:var(--muted)}.item strong{display:block;margin:4px 0;font-weight:600}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;min-width:0;overflow-wrap:anywhere}h2{font-size:22px;margin:4px 0 12px}a{color:var(--accent)}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0}.metric{padding:12px;background:var(--bg);border-radius:8px}.value{font-size:22px;font-weight:600}.badge{display:inline-block;background:var(--soft);color:var(--accent);border-radius:5px;padding:2px 8px;font-size:13px}textarea{width:100%;min-height:120px;resize:vertical;margin:8px 0}.review{border-top:1px solid var(--line);margin-top:24px;padding-top:18px}.empty{padding:48px 16px;text-align:center;color:var(--muted)}#progress{font-variant-numeric:tabular-nums}details{margin-top:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:350px;overflow:auto}.file-input{display:none}@media(max-width:760px){main{padding:16px}.layout{grid-template-columns:1fr}.list{max-height:300px}.panel{padding:18px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.filters label{width:100%;justify-content:space-between}.filters input{flex:1}}@media(prefers-color-scheme:dark){:root{--bg:#181e24;--panel:#222b33;--text:#edf1f5;--muted:#b2c0cc;--line:#45515d;--accent:#78d2b5;--soft:#233f37}button.primary{color:#142921}}
</style></head><body><main>
<h1>美食候选 · 复查台</h1><p>打开原视频，做判断，留一句理由。换一份数据，下次继续用。</p>
<div class="actions"><button id="open" class="primary">打开候选 JSONL</button><button id="export" disabled>导出复查记录</button><button id="restore" disabled>导入复查记录</button><span id="progress" role="status"></span></div>
<input id="file" class="file-input" type="file" accept=".jsonl,.json"><input id="reviewfile" class="file-input" type="file" accept=".json">
<div id="notice" role="status">选择 priority_36.jsonl 或下一批候选文件。文件只在当前浏览器中读取。</div>
<div class="filters"><label>平台 <select id="platform"><option value="">全部平台</option><option value="bilibili">B站</option><option value="douyin">抖音</option><option value="xiaohongshu">小红书</option></select></label><label>标签 <select id="tier"><option value="">全部标签</option><option>多项数据靠前</option><option>数据模糊</option><option>一项数据靠前</option><option>未分类</option></select></label><label>复查 <select id="status"><option value="">全部状态</option><option>未复查</option><option>保留</option><option>淘汰</option><option>待确认</option></select></label><label>搜索 <input id="search" type="search" placeholder="标题 / 作者 / ID"></label></div>
<div class="layout"><nav id="list" class="list" aria-label="候选视频列表"></nav><section id="detail" class="panel"><div class="empty">先打开一份候选数据<br>这里会展示视频信息、互动数据和复查笔记。</div></section></div>
<p style="margin-top:24px">数值是采集时的快照；“万”等约数与“+”原样保留。保留标记仅代表初步复查，不等于已完成正式核验或入选周报。离开前请导出复查记录备份。</p>
</main><script src="core.js"></script><script src="app.js"></script></body></html>
